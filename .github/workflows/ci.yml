name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: py${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # The three core gauges are pure stdlib on purpose — installing the
      # package itself must not pull torch. `[clip]`/`[face]` stay optional.
      - name: Install (core only)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Test (core, no model deps)
        run: python tests/test_gauges.py

      - name: CLI smoke
        run: |
          dfg selftest
          dfg check --help

      - name: Assert core install stayed dependency-free
        run: |
          python -c "import importlib.util as u, sys; \
          bad=[m for m in ('torch','transformers','numpy','cv2') if u.find_spec(m)]; \
          print('unexpected deps:', bad); sys.exit(1 if bad else 0)"
